
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payflow-redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payflow-redis
  template:
    metadata:
      labels:
        app: payflow-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payflow-redis
  namespace: default
spec:
  selector:
    app: payflow-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP